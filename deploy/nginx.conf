events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # Do not write QR tokens or personally identifying query strings to access logs.
    log_format minimal '$remote_addr $request_method $uri $status $request_time';
    access_log /dev/stdout minimal;
    error_log /dev/stderr warn;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 8m;
    keepalive_timeout 30;
    proxy_read_timeout 100;
    proxy_connect_timeout 5;
    server {
        listen 80;
        server_name _;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        location = /test { return 302 /test/; }
        location /test/ {
            set $test_backend http://test:8000;
            proxy_pass $test_backend;
        }
        location / {
            set $live_backend http://live:8000;
            proxy_pass $live_backend;
        }
    }
}
