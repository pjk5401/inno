{% extends 'base.html' %}{% block content %}<div class="page-head row-between"><div><h1>수업·명단 관리</h1></div><a class="button" href="{% url 'course_new' %}">+ 수업 등록</a></div><div class="card table-wrap"><table><thead><tr><th>일자</th><th>수업</th><th>시간</th><th>접수 사용</th><th>관리</th></tr></thead><tbody>{% for c in courses %}<tr><td>{{ c.starts_at|date:'Y.m.d' }}</td><td><a href="{% url 'course' c.pk %}">{{ c }}</a></td><td>{{ c.starts_at|date:'H:i' }}–{{ c.ends_at|date:'H:i' }}</td><td>{{ c.active|yesno:'사용,중지' }}</td><td><a href="{% url 'course_edit' c.pk %}">수정</a> · <a href="{% url 'course_delete' c.pk %}">삭제</a></td></tr>{% empty %}<tr><td colspan="5">수업을 등록해주세요.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
