{% extends 'base.html' %}{% block content %}
<div class="page-head"><h1>브라우저 학번 변경</h1><p class="muted">학생 화면의 ‘학번 변경’에서 확인 코드를 받아 조회하세요.</p></div>
<form method="get" class="card toolbar"><label>브라우저 확인 코드<input name="code" value="{{ code }}" maxlength="16" required autocomplete="off"></label><button>조회</button></form>
{% if identity %}<form method="post" class="card stack">{% csrf_token %}
<input type="hidden" name="code" value="{{ identity.support_code }}"><input type="hidden" name="revision" value="{{ identity.revision }}">
<p>현재 등록: <strong>{{ identity.student_id|default:'미등록' }} {{ identity.name }}</strong></p>
<div class="field-grid"><label>변경할 학번<input name="student_id" maxlength="40" required></label><label>이름<input name="name" maxlength="80" required></label></div>
<label>변경 사유<textarea name="reason" maxlength="1000" required></textarea></label>
<p class="small muted">학생 본인을 확인한 뒤 변경하세요. 기존 출석 기록은 유지되고, 이전 작성 화면은 무효화됩니다.</p><button>학번 변경</button></form>{% endif %}
{% endblock %}
