{% if rows.has_other_pages %}<div class="toolbar">{% if rows.has_previous %}<a href="?q={{ q|urlencode }}&state={{ state|urlencode }}&page={{ rows.previous_page_number }}">← 이전</a>{% endif %}<span>{{ rows.number }} / {{ rows.paginator.num_pages }}</span>{% if rows.has_next %}<a href="?q={{ q|urlencode }}&state={{ state|urlencode }}&page={{ rows.next_page_number }}">다음 →</a>{% endif %}</div>{% endif %}
