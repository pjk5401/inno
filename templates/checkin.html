{% extends 'base.html' %}{% block header_actions %}{% endblock %}{% load static %}{% block width %}narrow{% endblock %}{% block content %}
{% if mock %}<p class="small muted">모의 위치 판정</p>{% endif %}
<form id="checkin-form" class="card stack" data-guest-enabled="{{ show_guest_attendance|yesno:'1,0' }}" data-submit="{% url 'submit' %}" data-status="{% url 'attempt_status' %}" data-remaining="{{ remaining }}" data-generation="{{ generation }}" data-mock="{{ mock|yesno:'1,0' }}" data-storage="{% if is_sandbox %}test{% else %}live{% endif %}" data-identity="{{ identity.support_code }}-{{ identity.revision }}" data-bound-id="{{ identity.student_id }}" data-bound-name="{{ identity.name }}">{% csrf_token %}
{% if show_guest_attendance %}<fieldset class="attendance-kind"><legend>소속</legend><label><input type="radio" name="kind" value="course" checked> 소프트웨어대학</label><label><input type="radio" name="kind" value="guest"> 그 외</label></fieldset>{% else %}<input type="hidden" name="kind" value="course">{% endif %}
<label id="course-field">수업<select name="course" required><option value="">수업 선택</option>{% for c in courses %}<option value="{{ c.id }}">{{ c.label }}</option>{% endfor %}</select><span id="no-courses" class="small muted" {% if courses %}hidden{% endif %}>현재 출석 가능한 수업이 없습니다.</span></label>
<label id="department-field" hidden>학과<input name="department" maxlength="100" autocomplete="organization" disabled></label>
<div class="field-grid"><label>학번<input name="student_id" maxlength="40" autocomplete="off" required value="{{ identity.student_id }}" {% if identity.student_id %}readonly{% endif %}></label><label>이름<input name="name" maxlength="80" autocomplete="off" required value="{{ identity.name }}"></label></div>

<div><div class="row-between"><label for="signature">서명</label><button type="button" class="text-button" id="clear-signature">지우기</button></div><canvas id="signature" aria-label="손가락 또는 마우스로 서명하는 영역"></canvas></div>
<div id="form-error" class="notice error" role="alert" hidden></div><button id="submit-button" type="submit" class="full">출석 제출</button>

</form>{% endblock %}{% block scripts %}<script src="{% static 'vendor/signature_pad.umd.min.js' %}"></script><script src="{% static 'checkin.js' %}"></script>{% endblock %}
