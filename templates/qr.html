{% extends 'base.html' %}{% load static %}{% block content %}<section class="qr-screen" data-url="{% url 'qr_data' %}" id="qr-screen"><h1>출석 QR</h1>{% if is_sandbox %}<p>테스트 전용</p>{% endif %}<div class="qr-frame"><img id="qr-image" alt="출석 접속용 고정 QR" hidden><p id="qr-error" role="status">QR을 준비하고 있습니다.</p></div><p>QR 촬영 → 위치 확인 → 출석 제출</p><p class="small muted">접속 후 작성 시간 5분</p><div class="toolbar centered no-print"><button class="secondary" id="print-qr" disabled>인쇄</button><a class="button secondary" href="{% url 'qr_data' %}?download=1">PNG 저장</a><a class="button secondary" id="qr-link" href="#" target="_blank" rel="noopener" hidden>이 기기에서 열기</a></div></section>{% endblock %}{% block scripts %}<script src="{% static 'qr.js' %}"></script>{% endblock %}
