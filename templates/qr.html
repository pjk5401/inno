{% extends 'base.html' %}{% load static %}{% block content %}<section class="qr-screen" data-url="{% url 'qr_data' %}{% if expired %}?expired=1{% endif %}" id="qr-screen"><span class="eyebrow">{% if expired %}만료된 QR 테스트{% else %}SCAN TO CHECK IN{% endif %}</span><h1>휴대폰으로 스캔하고<br>출석해주세요</h1><div class="qr-frame"><img id="qr-image" alt="접속용 QR 준비 중" hidden><p id="qr-error" role="status">QR을 준비하고 있습니다.</p></div><p><strong id="qr-timer">—</strong>초 후 갱신 · 접속 후 작성 시간 5분</p><p id="qr-clock" class="muted"></p><p id="qr-mode"></p><div class="toolbar centered"><button class="secondary" id="fullscreen">전체 화면</button><a class="button secondary" id="qr-link" href="#" target="_blank" rel="noopener">이 기기에서 열기</a></div><p class="small muted">로그인 없이 수업 선택 → 학번·이름 → 서명 → 위치 확인</p></section>{% endblock %}{% block scripts %}<script src="{% static 'qr.js' %}"></script>{% endblock %}
